<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONI Display Catalog Viewer</title>
    <style>
        /* NEW: Custom PDF viewer layout. It keeps a PDF-reader style interface without download/print buttons. */
        :root {
            --toolbar: #3b3b3b;
            --toolbar-line: #505050;
            --sidebar: #262626;
            --stage: #2f2f2f;
            --text: #f5f5f5;
            --muted: #c8c8c8;
            --accent: #7aa7ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--stage);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .viewer {
            display: grid;
            grid-template-rows: 42px 1fr;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            display: grid;
            grid-template-columns: auto minmax(120px, 1fr) auto auto auto;
            align-items: center;
            gap: 14px;
            min-width: 0;
            padding: 0 12px;
            border-bottom: 1px solid #242424;
            background: var(--toolbar);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
        }

        .tool-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .title {
            overflow: hidden;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .icon-btn:hover,
        .icon-btn:focus-visible {
            background: #4a4a4a;
            outline: none;
        }

        .page-input {
            width: 42px;
            height: 26px;
            border: 1px solid var(--toolbar-line);
            border-radius: 3px;
            background: #171717;
            color: #fff;
            text-align: center;
        }

        .page-total,
        .zoom-label {
            color: var(--muted);
            font-size: 13px;
        }

        .zoom-select {
            width: 108px;
            height: 28px;
            border: 1px solid var(--toolbar-line);
            border-radius: 3px;
            background: #252525;
            color: #fff;
        }

        .content {
            display: grid;
            grid-template-columns: 236px 1fr;
            min-height: 0;
        }

        .content.sidebar-collapsed {
            grid-template-columns: 0 1fr;
        }

        .sidebar {
            min-height: 0;
            overflow-y: auto;
            border-right: 1px solid #202020;
            background: var(--sidebar);
            transition: width .18s ease;
        }

        .content.sidebar-collapsed .sidebar {
            overflow: hidden;
        }

        .thumb {
            display: grid;
            justify-items: center;
            gap: 7px;
            width: 100%;
            padding: 12px 12px 8px;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .thumb canvas {
            width: 126px;
            max-width: 100%;
            height: auto;
            background: #fff;
            box-shadow: 0 1px 7px rgba(0, 0, 0, .35);
        }

        .thumb.active canvas {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .thumb span {
            font-size: 12px;
        }

        .stage {
            min-height: 0;
            overflow: auto;
            background: var(--stage);
        }

        .pages {
            display: grid;
            justify-items: center;
            gap: 20px;
            min-width: max-content;
            padding: 28px 34px 42px;
        }

        .page {
            display: grid;
            place-items: center;
            background: #fff;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .42);
        }

        .page.loading {
            background:
                linear-gradient(90deg, #f4f4f4 25%, #ffffff 37%, #f4f4f4 63%);
            background-size: 400% 100%;
            animation: pageShimmer 1.2s ease-in-out infinite;
        }

        .page canvas {
            display: block;
            background: #fff;
        }

        .message {
            display: grid;
            place-items: center;
            height: 100%;
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @keyframes pageShimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        @media (max-width: 760px) {
            .toolbar {
                grid-template-columns: auto minmax(80px, 1fr) auto;
                gap: 8px;
            }

            .optional {
                display: none;
            }

            .content {
                grid-template-columns: 112px 1fr;
            }

            .thumb {
                padding: 9px 8px;
            }

            .thumb canvas {
                width: 74px;
            }
        }

        /* NEW: Hide the rendered catalog if someone opens the browser print dialog. */
        @media print {
            .viewer {
                display: none !important;
            }

            body::before {
                content: "Printing is disabled for this catalog viewer.";
                display: block;
                padding: 24px;
                background: #fff;
                color: #111;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <!-- NEW: Custom toolbar/sidebar/page structure replaces the browser's built-in PDF controls. -->
    <main class="viewer">
        <header class="toolbar">
            <div class="tool-group">
                <button class="icon-btn" id="sidebar-toggle" type="button" title="Toggle thumbnails">&#9776;</button>
            </div>
            <div class="title" id="catalog-title">ONI Display Catalog</div>
            <div class="tool-group">
                <input class="page-input" id="page-input" type="number" min="1" value="1" aria-label="Page number">
                <span class="page-total">/ <span id="page-count">0</span></span>
            </div>
            <div class="tool-group optional">
                <button class="icon-btn" id="zoom-out" type="button" title="Zoom out">&minus;</button>
                <select class="zoom-select" id="zoom-select" aria-label="Zoom">
                    <option value="0.75">75%</option>
                    <option value="1">100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="fit-page" selected>Fit Page</option>
                    <option value="fit-width">Fit Width</option>
                </select>
                <button class="icon-btn" id="zoom-in" type="button" title="Zoom in">+</button>
            </div>
            <div class="tool-group optional">
                <button class="icon-btn" id="rotate" type="button" title="Rotate">&#8635;</button>
            </div>
        </header>

        <section class="content" id="content">
            <aside class="sidebar" id="thumbnails" aria-label="Page thumbnails"></aside>
            <section class="stage" id="stage">
                <div class="pages" id="pages">
                    <div class="message">Loading catalog...</div>
                </div>
            </section>
        </section>
    </main>

    <!-- NEW: Local PDF.js files render PDFs inside our own viewer instead of the browser's PDF toolbar. -->
    <script src="./pdfs/build/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfs/build/pdf.worker.min.js";

        // NEW: The catalog list passes the PDF path and title through the URL.
        const params = new URLSearchParams(window.location.search);
        const file = params.get("file") || "";
        const title = params.get("title") || "ONI Display Catalog";
        const safePdfPath = /^assets\/pdf\/[A-Za-z0-9 _./&()·-]+\.pdf$/.test(file) && !file.includes("..");

        const stage = document.querySelector("#stage");
        const pagesEl = document.querySelector("#pages");
        const thumbsEl = document.querySelector("#thumbnails");
        const contentEl = document.querySelector("#content");
        const pageInput = document.querySelector("#page-input");
        const pageCount = document.querySelector("#page-count");
        const zoomSelect = document.querySelector("#zoom-select");

        let pdfDoc = null;
        let scale = 1;
        let rotation = 0;
        let pageCanvases = [];
        let thumbButtons = [];
        let pageObserver = null;
        let thumbObserver = null;
        let basePageViewport = null;
        let renderToken = 0;

        document.title = title;
        document.querySelector("#catalog-title").textContent = title;

        // NEW: Remove common save/print shortcuts and right-click entry points in the custom viewer.
        document.addEventListener("contextmenu", (event) => event.preventDefault());
        window.addEventListener("keydown", (event) => {
            const key = event.key.toLowerCase();
            if ((event.ctrlKey || event.metaKey) && (key === "s" || key === "p")) {
                event.preventDefault();
            }
        });

        document.querySelector("#sidebar-toggle").addEventListener("click", () => {
            contentEl.classList.toggle("sidebar-collapsed");
        });

        document.querySelector("#zoom-out").addEventListener("click", () => changeZoom(-0.25));
        document.querySelector("#zoom-in").addEventListener("click", () => changeZoom(0.25));
        document.querySelector("#rotate").addEventListener("click", () => {
            rotation = (rotation + 90) % 360;
            renderPages();
        });

        zoomSelect.addEventListener("change", () => renderPages());
        pageInput.addEventListener("change", () => {
            const pageNumber = clamp(Number(pageInput.value), 1, pdfDoc?.numPages || 1);
            scrollToPage(pageNumber);
        });

        stage.addEventListener("scroll", updateCurrentPage, { passive: true });
        window.addEventListener("resize", debounce(renderPages, 180));

        if (!safePdfPath) {
            pagesEl.innerHTML = '<div class="message">This catalog link is not available.</div>';
        } else {
            loadPdf(file);
        }

        // NEW: Load the selected PDF and initialize pages plus thumbnails.
        async function loadPdf(url) {
            try {
                // NEW: Load only what the viewer needs up front so large PDFs open faster.
                pdfDoc = await pdfjsLib.getDocument({
                    url,
                    disableAutoFetch: true,
                    disableStream: false
                }).promise;
                const firstPage = await pdfDoc.getPage(1);
                basePageViewport = firstPage.getViewport({ scale: 1, rotation });
                pageCount.textContent = pdfDoc.numPages;
                pageInput.max = String(pdfDoc.numPages);
                await renderPages(firstPage);
                renderThumbnails();
            } catch (error) {
                pagesEl.innerHTML = '<div class="message">The PDF could not be opened.</div>';
            }
        }

        // NEW: Create page canvases. Actual rendering is lazy so large catalogs open faster.
        async function renderPages(firstPage) {
            if (!pdfDoc) return;

            const token = ++renderToken;
            pagesEl.innerHTML = "";
            pageCanvases = [];
            if (pageObserver) pageObserver.disconnect();

            scale = await resolveScale(firstPage);
            pageObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        renderPageCanvas(entry.target);
                    }
                }
            }, {
                root: stage,
                rootMargin: "800px 0px",
                threshold: 0.01
            });

            for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
                if (token !== renderToken) return;

                const wrapper = document.createElement("div");
                const canvas = document.createElement("canvas");
                const viewport = basePageViewport || { width: 612, height: 792 };
                const ratio = window.devicePixelRatio || 1;
                const rotated = rotation === 90 || rotation === 270;
                const pageWidth = (rotated ? viewport.height : viewport.width) * scale;
                const pageHeight = (rotated ? viewport.width : viewport.height) * scale;

                wrapper.className = "page loading";
                wrapper.dataset.pageNumber = String(pageNumber);
                wrapper.dataset.scale = String(scale);
                wrapper.dataset.rotation = String(rotation);
                canvas.width = Math.floor(pageWidth * ratio);
                canvas.height = Math.floor(pageHeight * ratio);
                canvas.style.width = `${pageWidth}px`;
                canvas.style.height = `${pageHeight}px`;

                wrapper.appendChild(canvas);
                pagesEl.appendChild(wrapper);
                pageCanvases.push(wrapper);
                pageObserver.observe(wrapper);
            }

            renderPageCanvas(pageCanvases[0], firstPage);
            updateCurrentPage();
        }

        // NEW: Render only pages near the visible area.
        async function renderPageCanvas(wrapper, prefetchedPage) {
            if (!wrapper || wrapper.dataset.rendered === "true") return;

            wrapper.dataset.rendered = "true";
            const pageNumber = Number(wrapper.dataset.pageNumber);
            const canvas = wrapper.querySelector("canvas");
            const page = prefetchedPage || await pdfDoc.getPage(pageNumber);
            const viewport = page.getViewport({
                scale: Number(wrapper.dataset.scale),
                rotation: Number(wrapper.dataset.rotation)
            });
            const context = canvas.getContext("2d");
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.floor(viewport.width * ratio);
            canvas.height = Math.floor(viewport.height * ratio);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            await page.render({ canvasContext: context, viewport }).promise;
            wrapper.classList.remove("loading");
        }

        // NEW: Build the left thumbnail column immediately, then render thumbnail images lazily.
        function renderThumbnails() {
            thumbsEl.innerHTML = "";
            thumbButtons = [];
            if (thumbObserver) thumbObserver.disconnect();

            thumbObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        renderThumbnailCanvas(entry.target);
                    }
                }
            }, {
                root: thumbsEl,
                rootMargin: "500px 0px",
                threshold: 0.01
            });

            for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
                const button = document.createElement("button");
                const canvas = document.createElement("canvas");
                const label = document.createElement("span");

                button.className = "thumb";
                button.type = "button";
                button.dataset.pageNumber = String(pageNumber);
                button.addEventListener("click", () => scrollToPage(pageNumber));
                label.textContent = pageNumber;
                button.append(canvas, label);
                thumbsEl.appendChild(button);
                thumbButtons.push(button);
                thumbObserver.observe(button);
            }

            renderThumbnailCanvas(thumbButtons[0]);
            updateCurrentPage();
        }

        // NEW: Render only thumbnail images that are visible or near the visible area.
        async function renderThumbnailCanvas(button) {
            if (!button || button.dataset.rendered === "true") return;

            button.dataset.rendered = "true";
            const pageNumber = Number(button.dataset.pageNumber);
            const canvas = button.querySelector("canvas");
            const page = await pdfDoc.getPage(pageNumber);
            const viewport = page.getViewport({ scale: 0.18, rotation });
            const context = canvas.getContext("2d");
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.floor(viewport.width * ratio);
            canvas.height = Math.floor(viewport.height * ratio);
            canvas.style.width = `${viewport.width}px`;
            canvas.style.height = `${viewport.height}px`;
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            await page.render({ canvasContext: context, viewport }).promise;
        }

        // NEW: Pick a comfortable opening zoom, like the browser PDF viewer does.
        function resolveScale(firstPage) {
            const selected = zoomSelect.value;
            if (selected !== "fit-page" && selected !== "fit-width") return Number(selected);

            const viewport = (firstPage ? firstPage.getViewport({ scale: 1, rotation }) : basePageViewport) || { width: 612, height: 792 };
            const horizontalPadding = 96;
            const verticalPadding = 96;
            const availableWidth = Math.max(320, stage.clientWidth - horizontalPadding);
            const availableHeight = Math.max(320, stage.clientHeight - verticalPadding);
            const widthScale = availableWidth / viewport.width;
            const heightScale = availableHeight / viewport.height;
            const bestScale = selected === "fit-width" ? widthScale : Math.min(widthScale, heightScale);
            return Math.min(1.6, Math.max(0.25, bestScale));
        }

        function changeZoom(delta) {
            const current = zoomSelect.value === "fit-page" || zoomSelect.value === "fit-width" ? scale : Number(zoomSelect.value);
            const next = clamp(Math.round((current + delta) * 100) / 100, 0.5, 2);
            let option = [...zoomSelect.options].find((item) => Number(item.value) === next);
            if (!option) {
                option = new Option(`${Math.round(next * 100)}%`, String(next));
                zoomSelect.add(option, zoomSelect.options[zoomSelect.options.length - 1]);
            }
            zoomSelect.value = String(next);
            renderPages();
        }

        function scrollToPage(pageNumber) {
            const target = pageCanvases[pageNumber - 1];
            if (!target) return;
            target.scrollIntoView({ block: "start" });
            pageInput.value = String(pageNumber);
            setActiveThumb(pageNumber);
        }

        function updateCurrentPage() {
            if (!pageCanvases.length) return;

            const stageTop = stage.getBoundingClientRect().top;
            let current = 1;
            let smallestDistance = Infinity;

            for (const page of pageCanvases) {
                const pageNumber = Number(page.dataset.pageNumber);
                const distance = Math.abs(page.getBoundingClientRect().top - stageTop - 24);
                if (distance < smallestDistance) {
                    smallestDistance = distance;
                    current = pageNumber;
                }
            }

            pageInput.value = String(current);
            setActiveThumb(current);
        }

        function setActiveThumb(pageNumber) {
            for (const button of thumbButtons) {
                button.classList.toggle("active", Number(button.dataset.pageNumber) === pageNumber);
            }
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value || min));
        }

        function debounce(fn, delay) {
            let timer = 0;
            return () => {
                clearTimeout(timer);
                timer = setTimeout(fn, delay);
            };
        }
    </script>
</body>

</html>
