<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONI Display Catalog Viewer</title>
    <style>
        /* NEW: Custom PDF viewer layout. It keeps a PDF-reader style interface without download/print buttons. */
        :root {
            --toolbar: #3b3b3b;
            --toolbar-line: #505050;
            --sidebar: #262626;
            --stage: #2f2f2f;
            --text: #f5f5f5;
            --muted: #c8c8c8;
            --accent: #7aa7ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--stage);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .viewer {
            display: grid;
            grid-template-rows: 42px 1fr;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            display: grid;
            grid-template-columns: auto minmax(120px, 1fr) auto auto auto;
            align-items: center;
            gap: 14px;
            min-width: 0;
            padding: 0 12px;
            border-bottom: 1px solid #242424;
            background: var(--toolbar);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
        }

        .tool-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .title {
            overflow: hidden;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .icon-btn:hover,
        .icon-btn:focus-visible {
            background: #4a4a4a;
            outline: none;
        }

        .page-input {
            width: 42px;
            height: 26px;
            border: 1px solid var(--toolbar-line);
            border-radius: 3px;
            background: #171717;
            color: #fff;
            text-align: center;
        }

        .page-total,
        .zoom-label {
            color: var(--muted);
            font-size: 13px;
        }

        .zoom-select {
            width: 108px;
            height: 28px;
            border: 1px solid var(--toolbar-line);
            border-radius: 3px;
            background: #252525;
            color: #fff;
        }

        .content {
            display: grid;
            grid-template-columns: 236px 1fr;
            min-height: 0;
        }

        .content.sidebar-collapsed {
            grid-template-columns: 0 1fr;
        }

        .sidebar {
            min-height: 0;
            overflow-y: auto;
            border-right: 1px solid #202020;
            background: var(--sidebar);
            transition: width .18s ease;
        }

        .content.sidebar-collapsed .sidebar {
            overflow: hidden;
        }

        .thumb {
            display: grid;
            justify-items: center;
            gap: 7px;
            width: 100%;
            padding: 12px 12px 8px;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .thumb canvas {
            width: 126px;
            max-width: 100%;
            height: auto;
            background: #fff;
            box-shadow: 0 1px 7px rgba(0, 0, 0, .35);
        }

        .thumb.active canvas {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .thumb span {
            font-size: 12px;
        }

        .stage {
            min-height: 0;
            overflow: auto;
            background: var(--stage);
        }

        .pages {
            display: grid;
            justify-items: center;
            gap: 20px;
            min-width: max-content;
            padding: 28px 34px 42px;
        }

        .page {
            display: grid;
            place-items: center;
            background: #fff;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .42);
        }

        .page.loading {
            background:
                linear-gradient(90deg, #f4f4f4 25%, #ffffff 37%, #f4f4f4 63%);
            background-size: 400% 100%;
            animation: pageShimmer 1.2s ease-in-out infinite;
        }

        .page canvas {
            display: block;
            background: #fff;
        }

        .message {
            display: grid;
            place-items: center;
            height: 100%;
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @keyframes pageShimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        /* Mobile + tablet: hide the thumbnail sidebar completely so the PDF body gets the full screen. */
        @media (max-width: 1024px), (pointer: coarse) {
            .toolbar {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
                padding: 0 10px;
            }

            .toolbar > .tool-group:first-child,
            .optional,
            .sidebar {
                display: none !important;
            }

            .content,
            .content.sidebar-collapsed {
                grid-template-columns: 1fr;
            }

            .stage {
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }

            .pages {
                width: 100%;
                min-width: 0;
                gap: 12px;
                padding: 8px 4px 20px;
            }

            .page {
                max-width: calc(100vw - 8px);
                contain: layout paint;
            }

            .page canvas {
                max-width: 100%;
                height: auto;
            }
        }

        /* NEW: Hide the rendered catalog if someone opens the browser print dialog. */
        @media print {
            .viewer {
                display: none !important;
            }

            body::before {
                content: "Printing is disabled for this catalog viewer.";
                display: block;
                padding: 24px;
                background: #fff;
                color: #111;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <!-- NEW: Custom toolbar/sidebar/page structure replaces the browser's built-in PDF controls. -->
    <main class="viewer">
        <header class="toolbar">
            <div class="tool-group">
                <button class="icon-btn" id="sidebar-toggle" type="button" title="Toggle thumbnails">&#9776;</button>
            </div>
            <div class="title" id="catalog-title">ONI Display Catalog</div>
            <div class="tool-group">
                <input class="page-input" id="page-input" type="number" min="1" value="1" aria-label="Page number">
                <span class="page-total">/ <span id="page-count">0</span></span>
            </div>
            <div class="tool-group optional">
                <button class="icon-btn" id="zoom-out" type="button" title="Zoom out">&minus;</button>
                <select class="zoom-select" id="zoom-select" aria-label="Zoom">
                    <option value="0.75">75%</option>
                    <option value="1">100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="fit-page" selected>Fit Page</option>
                    <option value="fit-width">Fit Width</option>
                </select>
                <button class="icon-btn" id="zoom-in" type="button" title="Zoom in">+</button>
            </div>
            <div class="tool-group optional">
                <button class="icon-btn" id="rotate" type="button" title="Rotate">&#8635;</button>
            </div>
        </header>

        <section class="content" id="content">
            <aside class="sidebar" id="thumbnails" aria-label="Page thumbnails"></aside>
            <section class="stage" id="stage">
                <div class="pages" id="pages">
                    <div class="message">Loading catalog...</div>
                </div>
            </section>
        </section>
    </main>

    <!-- NEW: Local PDF.js files render PDFs inside our own viewer instead of the browser's PDF toolbar. -->
    <script src="./pdfs/build/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfs/build/pdf.worker.min.js";

        const params = new URLSearchParams(window.location.search);
        const file = params.get("file") || "";
        const title = params.get("title") || "ONI Display Catalog";
        const safePdfPath = /^assets\/pdf\/[A-Za-z0-9 _./&()·-]+\.pdf$/.test(file) && !file.includes("..");

        const stage = document.querySelector("#stage");
        const pagesEl = document.querySelector("#pages");
        const thumbsEl = document.querySelector("#thumbnails");
        const contentEl = document.querySelector("#content");
        const pageInput = document.querySelector("#page-input");
        const pageCount = document.querySelector("#page-count");
        const zoomSelect = document.querySelector("#zoom-select");
        const sidebarToggle = document.querySelector("#sidebar-toggle");
        const compactDevice = window.matchMedia("(max-width: 1024px), (pointer: coarse)");

        let pdfDoc = null;
        let scale = 1;
        let rotation = 0;
        let pageCanvases = [];
        let thumbButtons = [];
        let pageObserver = null;
        let thumbObserver = null;
        let basePageViewport = null;
        let renderToken = 0;
        let scrollRaf = 0;
        let activeThumb = null;
        const pageCache = new Map();

        document.title = title;
        document.querySelector("#catalog-title").textContent = title;

        document.addEventListener("contextmenu", (event) => event.preventDefault());
        window.addEventListener("keydown", (event) => {
            const key = event.key.toLowerCase();
            if ((event.ctrlKey || event.metaKey) && (key === "s" || key === "p")) {
                event.preventDefault();
            }
        });

        sidebarToggle.addEventListener("click", () => {
            if (!compactDevice.matches) contentEl.classList.toggle("sidebar-collapsed");
        });

        document.querySelector("#zoom-out").addEventListener("click", () => changeZoom(-0.25));
        document.querySelector("#zoom-in").addEventListener("click", () => changeZoom(0.25));
        document.querySelector("#rotate").addEventListener("click", async () => {
            rotation = (rotation + 90) % 360;
            await renderPages();
            scheduleThumbnails(true);
        });

        zoomSelect.addEventListener("change", () => renderPages());
        pageInput.addEventListener("change", () => {
            const pageNumber = clamp(Number(pageInput.value), 1, pdfDoc?.numPages || 1);
            scrollToPage(pageNumber);
        });

        stage.addEventListener("scroll", () => {
            if (scrollRaf) return;
            scrollRaf = requestAnimationFrame(() => {
                scrollRaf = 0;
                updateCurrentPage();
            });
        }, { passive: true });

        window.addEventListener("resize", debounce(() => {
            if (!pdfDoc) return;
            if (zoomSelect.value === "fit-page" || zoomSelect.value === "fit-width") {
                renderPages();
            }
        }, 220));

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", debounce(() => {
                if (pdfDoc && compactDevice.matches) renderPages();
            }, 180), { passive: true });
        }

        const onCompactChange = () => {
            if (compactDevice.matches) {
                contentEl.classList.remove("sidebar-collapsed");
                if (thumbObserver) thumbObserver.disconnect();
                thumbsEl.innerHTML = "";
                thumbButtons = [];
                activeThumb = null;
            } else if (pdfDoc && !thumbButtons.length) {
                scheduleThumbnails();
            }
        };
        if (compactDevice.addEventListener) compactDevice.addEventListener("change", onCompactChange);

        if (!safePdfPath) {
            pagesEl.innerHTML = '<div class="message">This catalog link is not available.</div>';
        } else {
            loadPdf(file);
        }

        function getPageCached(pageNumber) {
            if (!pageCache.has(pageNumber)) {
                pageCache.set(pageNumber, pdfDoc.getPage(pageNumber));
            }
            return pageCache.get(pageNumber);
        }

        function getRenderRatio(viewport) {
            const dpr = window.devicePixelRatio || 1;
            const isPhone = window.matchMedia("(max-width: 767px)").matches;
            const desired = compactDevice.matches
                ? Math.min(dpr, isPhone ? 2.25 : 2.0)
                : Math.min(dpr, 1.6);

            // Keep text sharp while preventing very large canvases from slowing down tablets.
            const maxPixels = compactDevice.matches ? 6000000 : 7500000;
            const cssPixels = Math.max(1, viewport.width * viewport.height);
            const pixelSafeRatio = Math.sqrt(maxPixels / cssPixels);
            return Math.max(1, Math.min(desired, pixelSafeRatio));
        }

        function prefetchNearbyPages(pageNumber) {
            if (!pdfDoc) return;
            const targets = [pageNumber + 1, pageNumber + 2].filter((n) => n <= pdfDoc.numPages);
            const run = () => targets.forEach((n) => getPageCached(n).catch(() => {}));
            if ("requestIdleCallback" in window) {
                requestIdleCallback(run, { timeout: 1200 });
            } else {
                setTimeout(run, 180);
            }
        }

        async function loadPdf(url) {
            try {
                pdfDoc = await pdfjsLib.getDocument({
                    url,
                    disableAutoFetch: true,
                    disableStream: false,
                    rangeChunkSize: compactDevice.matches ? 262144 : 524288
                }).promise;

                const firstPage = await getPageCached(1);
                basePageViewport = firstPage.getViewport({ scale: 1, rotation: 0 });
                pageCount.textContent = pdfDoc.numPages;
                pageInput.max = String(pdfDoc.numPages);

                await renderPages(firstPage);
                prefetchNearbyPages(1);
                scheduleThumbnails();
            } catch (error) {
                console.error(error);
                pagesEl.innerHTML = '<div class="message">The PDF could not be opened.</div>';
            }
        }

        async function renderPages(firstPage) {
            if (!pdfDoc) return;

            const token = ++renderToken;
            if (pageObserver) pageObserver.disconnect();
            pagesEl.innerHTML = "";
            pageCanvases = [];

            scale = await resolveScale(firstPage);
            if (token !== renderToken) return;

            pageObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) renderPageCanvas(entry.target);
                }
            }, {
                root: stage,
                rootMargin: compactDevice.matches ? "180px 0px" : "650px 0px",
                threshold: 0.01
            });

            const viewport = basePageViewport || { width: 612, height: 792 };
            const rotated = rotation === 90 || rotation === 270;
            const pageWidth = (rotated ? viewport.height : viewport.width) * scale;
            const pageHeight = (rotated ? viewport.width : viewport.height) * scale;
            const fragment = document.createDocumentFragment();

            for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
                const wrapper = document.createElement("div");
                const canvas = document.createElement("canvas");

                wrapper.className = "page loading";
                wrapper.dataset.pageNumber = String(pageNumber);
                wrapper.dataset.scale = String(scale);
                wrapper.dataset.rotation = String(rotation);
                wrapper.style.width = `${pageWidth}px`;
                wrapper.style.height = `${pageHeight}px`;

                // Important for speed: do not allocate a full-resolution canvas until this page is near the viewport.
                canvas.style.width = "100%";
                canvas.style.height = "100%";

                wrapper.appendChild(canvas);
                fragment.appendChild(wrapper);
                pageCanvases.push(wrapper);
            }

            pagesEl.appendChild(fragment);
            pageCanvases.forEach((wrapper) => pageObserver.observe(wrapper));

            await renderPageCanvas(pageCanvases[0], firstPage);
            updateCurrentPage();
        }

        async function renderPageCanvas(wrapper, prefetchedPage) {
            if (!wrapper || wrapper.dataset.rendered === "true" || wrapper.dataset.rendering === "true") return;

            wrapper.dataset.rendering = "true";
            const pageNumber = Number(wrapper.dataset.pageNumber);

            try {
                const page = prefetchedPage || await getPageCached(pageNumber);
                if (!wrapper.isConnected) return;

                const viewport = page.getViewport({
                    scale: Number(wrapper.dataset.scale),
                    rotation: Number(wrapper.dataset.rotation)
                });
                const canvas = wrapper.querySelector("canvas");
                const context = canvas.getContext("2d", { alpha: false });
                const ratio = getRenderRatio(viewport);

                wrapper.style.width = `${viewport.width}px`;
                wrapper.style.height = `${viewport.height}px`;
                canvas.width = Math.max(1, Math.floor(viewport.width * ratio));
                canvas.height = Math.max(1, Math.floor(viewport.height * ratio));
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);

                await page.render({ canvasContext: context, viewport }).promise;
                wrapper.dataset.rendered = "true";
                wrapper.classList.remove("loading");
                if (pageObserver) pageObserver.unobserve(wrapper);
                prefetchNearbyPages(pageNumber);
            } catch (error) {
                console.error(`Page ${pageNumber} render failed`, error);
                wrapper.dataset.rendered = "";
            } finally {
                wrapper.dataset.rendering = "";
            }
        }

        function scheduleThumbnails(force = false) {
            if (!pdfDoc || compactDevice.matches) return;

            const run = () => {
                if (force || !thumbButtons.length) renderThumbnails();
            };

            if ("requestIdleCallback" in window) {
                requestIdleCallback(run, { timeout: 900 });
            } else {
                setTimeout(run, 120);
            }
        }

        function renderThumbnails() {
            if (!pdfDoc || compactDevice.matches) return;

            if (thumbObserver) thumbObserver.disconnect();
            thumbsEl.innerHTML = "";
            thumbButtons = [];
            activeThumb = null;

            thumbObserver = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) renderThumbnailCanvas(entry.target);
                }
            }, {
                root: thumbsEl,
                rootMargin: "220px 0px",
                threshold: 0.01
            });

            const fragment = document.createDocumentFragment();
            for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
                const button = document.createElement("button");
                const canvas = document.createElement("canvas");
                const label = document.createElement("span");

                button.className = "thumb";
                button.type = "button";
                button.dataset.pageNumber = String(pageNumber);
                button.addEventListener("click", () => scrollToPage(pageNumber));
                label.textContent = pageNumber;
                button.append(canvas, label);
                fragment.appendChild(button);
                thumbButtons.push(button);
            }

            thumbsEl.appendChild(fragment);
            thumbButtons.forEach((button) => thumbObserver.observe(button));
            renderThumbnailCanvas(thumbButtons[0]);
            updateCurrentPage();
        }

        async function renderThumbnailCanvas(button) {
            if (!button || button.dataset.rendered === "true" || button.dataset.rendering === "true") return;

            button.dataset.rendering = "true";
            const pageNumber = Number(button.dataset.pageNumber);

            try {
                const page = await getPageCached(pageNumber);
                if (!button.isConnected) return;

                const canvas = button.querySelector("canvas");
                const viewport = page.getViewport({ scale: 0.16, rotation });
                const context = canvas.getContext("2d", { alpha: false });
                const ratio = Math.min(window.devicePixelRatio || 1, 1.25);

                canvas.width = Math.max(1, Math.floor(viewport.width * ratio));
                canvas.height = Math.max(1, Math.floor(viewport.height * ratio));
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);

                await page.render({ canvasContext: context, viewport }).promise;
                button.dataset.rendered = "true";
                if (thumbObserver) thumbObserver.unobserve(button);
            } catch (error) {
                console.error(`Thumbnail ${pageNumber} render failed`, error);
                button.dataset.rendered = "";
            } finally {
                button.dataset.rendering = "";
            }
        }

        function resolveScale(firstPage) {
            const selected = zoomSelect.value;
            if (selected !== "fit-page" && selected !== "fit-width") return Number(selected);

            const viewport = (firstPage ? firstPage.getViewport({ scale: 1, rotation }) : null) ||
                (basePageViewport ? {
                    width: (rotation === 90 || rotation === 270) ? basePageViewport.height : basePageViewport.width,
                    height: (rotation === 90 || rotation === 270) ? basePageViewport.width : basePageViewport.height
                } : { width: 612, height: 792 });

            const horizontalPadding = compactDevice.matches ? 8 : 96;
            const verticalPadding = compactDevice.matches ? 20 : 96;
            const availableWidth = Math.max(240, stage.clientWidth - horizontalPadding);
            const availableHeight = Math.max(240, stage.clientHeight - verticalPadding);
            const widthScale = availableWidth / viewport.width;
            const heightScale = availableHeight / viewport.height;
            // Phones and tablets always open at full readable width because zoom controls are hidden there.
            const bestScale = compactDevice.matches
                ? widthScale
                : (selected === "fit-width" ? widthScale : Math.min(widthScale, heightScale));

            return Math.min(compactDevice.matches ? 2.2 : 1.6, Math.max(0.25, bestScale));
        }

        function changeZoom(delta) {
            const current = (zoomSelect.value === "fit-page" || zoomSelect.value === "fit-width") ? scale : Number(zoomSelect.value);
            const next = clamp(Math.round((current + delta) * 100) / 100, 0.5, 2);
            let option = [...zoomSelect.options].find((item) => Number(item.value) === next);

            if (!option) {
                option = new Option(`${Math.round(next * 100)}%`, String(next));
                zoomSelect.add(option, zoomSelect.options[zoomSelect.options.length - 2]);
            }

            zoomSelect.value = String(next);
            renderPages();
        }

        function scrollToPage(pageNumber) {
            const target = pageCanvases[pageNumber - 1];
            if (!target) return;

            stage.scrollTo({ top: Math.max(0, target.offsetTop - 12), behavior: "auto" });
            pageInput.value = String(pageNumber);
            setActiveThumb(pageNumber);
            renderPageCanvas(target);
        }

        function updateCurrentPage() {
            if (!pageCanvases.length) return;

            const targetY = stage.scrollTop + 30;
            let low = 0;
            let high = pageCanvases.length - 1;
            let index = 0;

            while (low <= high) {
                const mid = (low + high) >> 1;
                if (pageCanvases[mid].offsetTop <= targetY) {
                    index = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }

            const current = index + 1;
            pageInput.value = String(current);
            setActiveThumb(current);
            prefetchNearbyPages(current);
        }

        function setActiveThumb(pageNumber) {
            if (!thumbButtons.length) return;
            const next = thumbButtons[pageNumber - 1];
            if (!next || next === activeThumb) return;
            if (activeThumb) activeThumb.classList.remove("active");
            next.classList.add("active");
            activeThumb = next;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value || min));
        }

        function debounce(fn, delay) {
            let timer = 0;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }
    </script>
</body>

</html>
